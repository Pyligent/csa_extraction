version: '3.9'
services:
  api:
    build: ./services/api
    ports:
      - "8000:8000"
    environment:
      EXTRACTOR_REPO_DIR: /workspace
    volumes:
      - ./:/workspace
      - ./data:/data
  web:
    build: ./services/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - api
